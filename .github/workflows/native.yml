# SPDX-License-Identifier: GPL-3.0-only
name: Native cores
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, strict]
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-format-19 clang-tidy-19 lld-19 ninja-build ccache
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: cmake --build --preset ${{ matrix.preset }} --target format-check
      - run: ctest --preset ${{ matrix.preset }} --parallel 2 --timeout 120
  macos-arm64-foundation:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        preset: [release, strict]
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 19
        run: brew install llvm@19 ninja ccache
      - name: Repair LLVM 19 sanitizer initialization
        if: matrix.preset == 'strict'
        run: |
          runtime_resource="$(python3 tools/darwin_runtime.py)"
          echo "LLVM19_RESOURCE_DIR=$runtime_resource" >> "$GITHUB_ENV"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2 --target dsp56300_host_mac_test dsp56300_executable_arena_test
      - run: cmake --build --preset ${{ matrix.preset }} --target format-check
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure -R '^(host-mac-products|executable-arena)$'
